<!DOCTYPE html>
<html lang="en">
<!-- WebGL reference for compare-webgpu.html: same file, pose and camera, still. -->
<head>
  <meta charset="utf-8">
  <title>Spark • compare (WebGL)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/build/three.module.js", "@sparkjsdev/spark": "../../dist/spark.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";
    import { setupCompare } from "./compare.js";

    const { file, pose, size } = setupCompare();
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(size.w, size.h);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, size.w / size.h, 0.1, 1000);
    scene.add(new SparkRenderer({ renderer }));
    const mesh = new SplatMesh({ url: await getAssetFileURL(file) });
    pose(mesh);
    scene.add(mesh);
    await mesh.initialized;
    let frames = 0;
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
      if (++frames === 30) window.__ready = true;
    });
  </script>
</body>
</html>
