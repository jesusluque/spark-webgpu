<!DOCTYPE html>
<html lang="en">
<!-- WebGL reference for compare-webgpu.html: same file, pose and camera, still. -->
<head>
  <meta charset="utf-8">
  <title>Spark • compare (WebGL)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/build/three.module.js", "@sparkjsdev/spark": "../../dist/spark.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { PackedSplats, SparkRenderer, SplatMesh, utils } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";
    import { bench, setupCompare, syntheticPacked, waitSettled } from "./compare.js";

    const { file, n, flat, lod, rad, lodSplatCount, pose, size, options, ext } = setupCompare();
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(size.w, size.h);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, size.w / size.h, 0.1, 1000);
    const spark = new SparkRenderer({ renderer, lodSplatCount, ...options });
    scene.add(spark);
    const mesh = n
      ? new SplatMesh({ packedSplats: new PackedSplats({ packedArray: syntheticPacked(utils, n, flat), numSplats: n }) })
      : rad
        ? new SplatMesh({ url: rad, paged: true })
        : new SplatMesh({ url: await getAssetFileURL(file), lod, extSplats: ext, covSplats: options.covSplats });
    pose(mesh);
    scene.add(mesh);
    await mesh.initialized;
    let frames = 0;
    const settled = lod || rad
      ? waitSettled(() => ({
        lod: spark.currentLod?.timestamp ?? null,
        splats: mesh.paged ? mesh.paged.numSplats : (spark.lodInstances.get(mesh)?.numSplats ?? 0),
        pending: !spark.currentLod || (spark.pager?.isPending() ?? false),
      }))
      : Promise.resolve();
    settled.then((s) => { window.__lodState = s; });
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
      if (++frames >= 30 && window.__lodState !== undefined || (!lod && !rad && frames === 30)) window.__ready = true;
    });
    window.__spark = spark;
    const gl = renderer.getContext();
    const pixel = new Uint8Array(4);
    // Throughput: the normal animation loop for `seconds`, the object turning
    // every frame; frames counted (run Chrome without vsync to uncap it).
    window.__fps = (seconds) =>
      new Promise((resolve) => {
        let count = 0;
        const t0 = performance.now();
        renderer.setAnimationLoop(() => {
          mesh.rotation.y += 0.01;
          renderer.render(scene, camera);
          count++;
          const t = performance.now() - t0;
          if (t >= seconds * 1000) {
            renderer.setAnimationLoop(null);
            resolve({ fps: (count * 1000) / t, msPerFrame: t / count });
          }
        });
      });
    window.__bench = async (count) => {
      renderer.setAnimationLoop(null);
      return bench(count, () => {
        mesh.rotation.y += 0.01;
        renderer.render(scene, camera);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel); // waits for the GPU
      });
    };
  </script>
</body>
</html>
