<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • SOGS (WebGPU)</title>
  <style>
    body {
      margin: 0;
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.module.js",
        "three/webgpu": "../js/vendor/three/build/three.webgpu.js",
        "three/tsl": "../js/vendor/three/build/three.tsl.js",
        "three/addons/": "../js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "../../dist/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    // three's WebGPU sky is SkyMesh, with the same uniforms as nodes.
    import { SkyMesh as Sky } from 'three/addons/objects/SkyMesh.js';
    import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 1.5, -1.2);

    const renderer = new THREE.WebGPURenderer();
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    document.body.appendChild(renderer.domElement);
    // WebGPURenderer clears to transparent; WebGLRenderer's default is opaque black.
    renderer.setClearColor(0x000000, 1);

    window.addEventListener('resize', onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const splatURL = await getAssetFileURL("sutro.zip");
    const sutroTower = new SplatMesh({ url: splatURL });
    sutroTower.quaternion.set(1, 0, 0, 0);
    scene.add(sutroTower);

    const sky = new Sky();
    sky.scale.setScalar(450000);
    const phi = THREE.MathUtils.degToRad(20);
    const theta = THREE.MathUtils.degToRad(90);
    const sunPosition = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
    sky.sunPosition.value = sunPosition;
    scene.add( sky );

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.minDistance = 0.2;
    controls.maxDistance = 8.0;
    controls.enablePan = false;

    renderer.setAnimationLoop(function animate(time) {
      controls.update(camera);
      renderer.render(scene, camera);
    });
  </script>
</body>

</html>
