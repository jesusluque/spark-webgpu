<!DOCTYPE html>
<html lang="en">
<!-- The WebGPU side of the comparison with compare-webgl.html. -->
<head>
  <meta charset="utf-8">
  <title>Spark • compare (WebGPU)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/build/three.webgpu.js", "three/webgpu": "../js/vendor/three/build/three.webgpu.js", "@sparkjsdev/spark": "../../dist/spark.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { GpuSplatSource, PackedSplats, WgpuSplatRenderer } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";
    import { setupCompare } from "./compare.js";

    const { file, pose, size } = setupCompare();
    const renderer = new THREE.WebGPURenderer();
    renderer.setSize(size.w, size.h);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(60, size.w / size.h, 0.1, 1000);
    const packed = new PackedSplats({ url: await getAssetFileURL(file) });
    await packed.initialized;
    const splats = new WgpuSplatRenderer(renderer);
    const holder = new THREE.Object3D();
    pose(holder);
    splats.add(GpuSplatSource.fromPackedSplats(splats.device, packed), holder);
    window.__splats = splats;
    let frames = 0;
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
      splats.render(camera);
      if (++frames === 30) window.__ready = true;
    });
  </script>
</body>
</html>
