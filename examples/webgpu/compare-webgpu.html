<!DOCTYPE html>
<html lang="en">
<!-- The WebGPU side of the comparison with compare-webgl.html. -->
<head>
  <meta charset="utf-8">
  <title>Spark • compare (WebGPU)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/build/three.webgpu.js", "three/webgpu": "../js/vendor/three/build/three.webgpu.js", "@sparkjsdev/spark": "../../dist/spark.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { ExtSplats, GpuSplatSource, PackedSplats, PagedSplats, WgpuLod, WgpuSplatRenderer, utils } from "@sparkjsdev/spark";
    import { getAssetFileURL } from "../js/get-asset-url.js";
    import { bench, setupCompare, syntheticPacked, waitSettled } from "./compare.js";

    const { file, n, lod, rad, lodSplatCount, pose, size, options, ext } = setupCompare();
    // The page pool binds whole pools: take the adapter's larger limits.
    const adapter = await navigator.gpu.requestAdapter();
    const renderer = new THREE.WebGPURenderer({
      requiredLimits: {
        maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
        maxBufferSize: adapter.limits.maxBufferSize,
      },
    });
    renderer.setSize(size.w, size.h);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const camera = new THREE.PerspectiveCamera(60, size.w / size.h, 0.1, 1000);
    const splats = new WgpuSplatRenderer(renderer, { sort: new URLSearchParams(location.search).get("sort") ?? "gpu", sortBits: Number(new URLSearchParams(location.search).get("sortBits") ?? 32), ...options });
    const holder = new THREE.Object3D();
    pose(holder);
    const lodDriver = lod || rad ? new WgpuLod(splats, { lodSplatCount }) : null;
    if (rad) {
      await lodDriver.add(new PagedSplats({ rootUrl: rad }), holder);
    } else if (ext && !n && !lod) {
      const splatsExt = new ExtSplats({ url: await getAssetFileURL(file) });
      await splatsExt.initialized;
      splats.add(GpuSplatSource.fromExtSplats(splats.device, splatsExt), holder);
    } else {
      const packed = n
        ? new PackedSplats({ packedArray: syntheticPacked(utils, n), numSplats: n })
        : new PackedSplats({ url: await getAssetFileURL(file), lod });
      if (lodDriver) {
        await lodDriver.add(packed, holder);
      } else {
        await packed.initialized;
        splats.add(GpuSplatSource.fromPackedSplats(splats.device, packed), holder);
      }
    }
    window.__splats = splats;
    window.__lod = lodDriver;
    const settled = lodDriver
      ? waitSettled(() => ({
        lod: lodDriver.stats.traversals,
        splats: lodDriver.stats.lodSplats,
        pending: lodDriver.stats.traversals === 0 || (lodDriver.pager?.isPending() ?? false),
      }))
      : Promise.resolve();
    settled.then((s) => { window.__lodState = s; });
    let frames = 0;
    renderer.setAnimationLoop(() => {
      lodDriver?.update(camera);
      renderer.render(scene, camera);
      splats.render(camera);
      if (++frames >= 30 && window.__lodState !== undefined || (!lodDriver && frames === 30)) window.__ready = true;
    });
    // Throughput: the normal animation loop for `seconds`, the object turning
    // every frame; frames counted (run Chrome without vsync to uncap it).
    window.__fps = (seconds) =>
      new Promise((resolve) => {
        let count = 0;
        const t0 = performance.now();
        renderer.setAnimationLoop(() => {
          holder.rotation.y += 0.01;
          lodDriver?.update(camera);
          renderer.render(scene, camera);
        splats.render(camera);
          count++;
          const t = performance.now() - t0;
          if (t >= seconds * 1000) {
            renderer.setAnimationLoop(null);
            resolve({ fps: (count * 1000) / t, msPerFrame: t / count });
          }
        });
      });
    window.__bench = async (count) => {
      renderer.setAnimationLoop(null);
      const result = await bench(count, async () => {
        holder.rotation.y += 0.01;
        lodDriver?.update(camera);
        renderer.render(scene, camera);
        splats.render(camera);
        await splats.device.queue.onSubmittedWorkDone();
      });
      return { ...result, cpuSortMs: splats.stats.sortMs, sorts: splats.stats.sorts };
    };
  </script>
</body>
</html>
