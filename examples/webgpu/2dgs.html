<!DOCTYPE html>
<html lang="en">
<!--
  2D Gaussian splats on WebGPU (WgpuSplatRenderer enable2DGS, as
  SparkRenderer enable2DGS): splats with a zero scale drawn as flat discs in
  their plane instead of projected 3D Gaussians. A shell of flat splats; turn
  it edge-on to see the difference. Parity with WebGL:
  compare-webgl.html / compare-webgpu.html ?n=20000&flat=1&enable2DGS=1
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • 2DGS (WebGPU)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; touch-action: none; }</style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.webgpu.js",
        "three/webgpu": "../js/vendor/three/build/three.webgpu.js",
        "three/addons/": "../js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "../../dist/spark.module.js",
        "@sparkjsdev/spark/webgpu": "../../dist/spark.webgpu.module.js",
        "lil-gui": "../js/vendor/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { utils } from "@sparkjsdev/spark";
    import { GpuSplatSource, WgpuSplatRenderer } from "@sparkjsdev/spark/webgpu";
    import GUI from "lil-gui";

    const renderer = new THREE.WebGPURenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    await renderer.init();
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 0.8, 2.6);
    const controls = new OrbitControls(camera, renderer.domElement);
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Flat splats tangent to a sphere: z scale 0.
    const count = 20000;
    const a = new Uint32Array(count * 4);
    const b = new Uint32Array(count * 4);
    const up = new THREE.Vector3(0, 0, 1);
    const dir = new THREE.Vector3();
    const q = new THREE.Quaternion();
    for (let i = 0; i < count; i++) {
      const u = 1 - (2 * (i + 0.5)) / count;
      const t = i * Math.PI * (3 - Math.sqrt(5));
      const r = Math.sqrt(1 - u * u);
      dir.set(r * Math.cos(t), u, r * Math.sin(t));
      q.setFromUnitVectors(up, dir);
      utils.encodeExtSplat([a, b], i, dir.x, dir.y, dir.z, 0.02, 0.012, 0, q.x, q.y, q.z, q.w,
        0.9, 0.5 + 0.5 * dir.x, 0.5 + 0.5 * dir.y, 0.5 + 0.5 * dir.z);
    }
    const splats = new WgpuSplatRenderer(renderer, { enable2DGS: true });
    splats.add(GpuSplatSource.fromExt(splats.device, a, b, count));
    window.__splats = splats;

    const gui = new GUI({ title: "2DGS" });
    gui.add(splats.options, "enable2DGS");

    let frames = 0;
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
      splats.render(camera);
      if (++frames === 30) window.__ready = true;
    });
  </script>
</body>
</html>
