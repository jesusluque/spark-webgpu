<!DOCTYPE html>
<html lang="en">
<!-- examples/depth-of-field on WebGPU: WgpuSplatRenderer's focalDistance and apertureAngle. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Depth of Field (WebGPU) (WgpuSplatRenderer)</title>
  <style>body { margin: 0; background: #000; } canvas { display: block; touch-action: none; }</style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "../js/vendor/three/build/three.webgpu.js",
        "three/webgpu": "../js/vendor/three/build/three.webgpu.js",
        "@sparkjsdev/spark": "../../dist/spark.module.js",
        "@sparkjsdev/spark/webgpu": "../../dist/spark.webgpu.module.js",
        "lil-gui": "../js/vendor/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three/webgpu";
    import { PackedSplats, SparkControls } from "@sparkjsdev/spark";
    import { GpuSplatSource, WgpuSplatRenderer } from "@sparkjsdev/spark/webgpu";
    import GUI from "lil-gui";
    import { getAssetFileURL } from "../js/get-asset-url.js";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGPURenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    await renderer.init();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const splats = new WgpuSplatRenderer(renderer, { focalDistance: 5.0 });
    const options = splats.options;
    const apertureSize = { apertureSize: 0.1 };
    function updateApertureAngle() {
      options.apertureAngle = options.focalDistance > 0
        ? 2 * Math.atan(0.5 * apertureSize.apertureSize / options.focalDistance)
        : 0.0;
    }
    updateApertureAngle();

    const gui = new GUI({ title: "DoF settings" });
    gui.add(options, "focalDistance", 0, 15, 0.01).name("Focal plane dist").onChange(updateApertureAngle);
    gui.add(apertureSize, "apertureSize", 0, 0.4, 0.01).name("Aperture size").onChange(updateApertureAngle);

    const packed = new PackedSplats({ url: await getAssetFileURL("valley.spz") });
    await packed.initialized;
    const background = new THREE.Object3D();
    background.quaternion.set(1, 0, 0, 0);
    background.scale.setScalar(0.5);
    splats.add(GpuSplatSource.fromPackedSplats(splats.device, packed), background);
    window.__splats = splats;

    const controls = new SparkControls({ canvas: renderer.domElement });
    let frames = 0;
    renderer.setAnimationLoop(() => {
      controls.update(camera);
      renderer.render(scene, camera);
      splats.render(camera);
      if (++frames === 30) window.__ready = true;
    });
  </script>
</body>
</html>
